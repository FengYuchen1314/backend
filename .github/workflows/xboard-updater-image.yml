name: Build Xboard Updater Image

on:
  push:
    branches:
      - xboard-dev
    paths:
      - updater/**
      - Dockerfile
      - docker-entrypoint.sh
      - docker-compose-xboard.yml
      - .github/workflows/xboard-updater-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: xboard-updater-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fengyuchen1314/backend-updater

jobs:
  validate:
    name: Validate updater before publishing
    if: github.repository == 'FengYuchen1314/backend' && github.ref == 'refs/heads/xboard-dev'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: updater/go.mod
          cache: false

      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l updater)"

      - name: Vet
        working-directory: updater
        run: go vet ./...

      - name: Test
        working-directory: updater
        run: go test -race ./...

  build:
    name: Build and publish updater image
    if: github.repository == 'FengYuchen1314/backend' && github.ref == 'refs/heads/xboard-dev'
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push updater image
        uses: docker/build-push-action@v7
        with:
          context: updater
          file: updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:xboard-dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
