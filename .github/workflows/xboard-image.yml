name: Build Xboard Backend Image

on:
  push:
    branches:
      - xboard-dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: xboard-backend-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fengyuchen1314/backend
  FRONTEND_URL: https://github.com/FengYuchen1314/frontend/releases/download/xboard-dev-build/remnawave-frontend.zip

jobs:
  build:
    name: Build and publish test image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "version=$(jq -r .version package.json)-xboard" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$(gh api repos/FengYuchen1314/frontend/commits/xboard-dev --jq .sha)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:xboard-dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            BRANCH=xboard-dev
            FRONTEND_URL=${{ env.FRONTEND_URL }}
            __RW_METADATA_VERSION=${{ steps.metadata.outputs.version }}
            __RW_METADATA_GIT_BRANCH=xboard-dev
            __RW_METADATA_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
