name: Build Xboard Backend Image

on:
  push:
    branches:
      - xboard-dev
permissions:
  contents: read
  packages: write

concurrency:
  group: xboard-backend-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fengyuchen1314/backend

jobs:
  validate:
    name: Validate backend before publishing
    if: github.repository == 'FengYuchen1314/backend' && github.ref == 'refs/heads/xboard-dev'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "$base" "$GITHUB_SHA" -- \
              '*.css' '*.js' '*.json' '*.md' '*.prisma' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Generate Prisma client
        run: npm run migrate:generate

      - name: Build
        run: npm run build

  build:
    name: Build and publish test image
    if: github.repository == 'FengYuchen1314/backend' && github.ref == 'refs/heads/xboard-dev'
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_json="$(gh api repos/FengYuchen1314/frontend/releases/tags/xboard-dev-build)"
          release_target="$(jq -r '.target_commitish' <<<"$release_json")"
          frontend_commit="$(gh api repos/FengYuchen1314/frontend/commits/xboard-dev --jq .sha)"
          backend_contract_tree="$(git rev-parse HEAD:libs/contract)"
          frontend_asset_name="remnawave-frontend-${frontend_commit}-${backend_contract_tree}.zip"
          frontend_url="$(jq -r --arg name "$frontend_asset_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release_json")"
          frontend_sha256="$(jq -r --arg name "$frontend_asset_name" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")' <<<"$release_json")"

          if [[ -z "$frontend_url" || -z "$frontend_sha256" ]]; then
            has_bound_assets="$(jq -r '[.assets[].name | test("^remnawave-frontend-[a-f0-9]{40}-[a-f0-9]{40}\\.zip$")] | any' <<<"$release_json")"
            [[ "$has_bound_assets" == "false" ]]
            [[ "$release_target" == "$frontend_commit" ]]
            frontend_url="$(jq -r '.assets[] | select(.name == "remnawave-frontend.zip") | .browser_download_url' <<<"$release_json")"
            frontend_sha256="$(jq -r '.assets[] | select(.name == "remnawave-frontend.zip") | .digest | sub("^sha256:"; "")' <<<"$release_json")"
          fi

          [[ "$frontend_url" == https://github.com/FengYuchen1314/frontend/releases/download/* ]]
          [[ "$frontend_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$frontend_commit" =~ ^[a-f0-9]{40}$ ]]

          echo "version=$(jq -r .version package.json)-xboard" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$frontend_url" >> "$GITHUB_OUTPUT"
          echo "frontend_sha256=$frontend_sha256" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$frontend_commit" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:xboard-dev
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            BRANCH=xboard-dev
            SOURCE_REPOSITORY=https://github.com/FengYuchen1314/backend
            FRONTEND_URL=${{ steps.metadata.outputs.frontend_url }}
            FRONTEND_SHA256=${{ steps.metadata.outputs.frontend_sha256 }}
            FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend_commit }}
            __RW_METADATA_VERSION=${{ steps.metadata.outputs.version }}
            __RW_METADATA_GIT_BRANCH=xboard-dev
            __RW_METADATA_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
