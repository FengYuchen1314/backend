name: Build Xboard Backend Image

on:
  workflow_dispatch:
    inputs:
      frontend_commit:
        description: 'Optional exact frontend commit (default: resolve xboard-dev once)'
        required: false
        type: string
  push:
    branches:
      - xboard-dev
      - 'wip/**'
permissions:
  contents: read
  packages: write

concurrency:
  group: xboard-backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/fengyuchen1314/backend

jobs:
  validate:
    name: Validate backend before publishing
    if: github.repository == 'FengYuchen1314/backend'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edge_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: edge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edge_test -d edge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "$base" "$GITHUB_SHA" -- \
              '*.css' '*.js' '*.json' '*.md' '*.prisma' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test && npm run test:topology && npm run test:seed

      - name: Test generated topology subscriptions with real clients
        run: bash scripts/test-topology-clients.sh

      - name: Generate Prisma client
        run: npm run migrate:generate

      - name: Test edge settings migrations and concurrent writes
        env:
          DATABASE_URL: postgresql://edge_test:disposable-ci-password@127.0.0.1:5432/edge_test
          DIRECT_URL: postgresql://edge_test:disposable-ci-password@127.0.0.1:5432/edge_test
          EDGE_DATABASE_TEST_URL: postgresql://edge_test:disposable-ci-password@127.0.0.1:5432/edge_test
        run: npm run migrate:deploy && npm run test:edge-settings && npm run test:topology-db

      - name: Build
        run: npm run build

      - name: Verify application dependency wiring and OpenAPI generation
        run: npm run generate:openapi && test -s openapi.json

  build:
    name: Build and publish test image
    if: github.repository == 'FengYuchen1314/backend'
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Node.js for the paired frontend build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0

      - name: Build frontend against this exact backend contract
        id: metadata
        env:
          REQUESTED_FRONTEND_COMMIT: ${{ inputs.frontend_commit }}
        shell: bash
        run: |
          frontend_dir="$RUNNER_TEMP/paired-frontend"
          git clone --depth 1 --branch xboard-dev https://github.com/FengYuchen1314/frontend.git "$frontend_dir"
          if [[ -n "$REQUESTED_FRONTEND_COMMIT" ]]; then
            [[ "$REQUESTED_FRONTEND_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            git -C "$frontend_dir" fetch --depth 1 origin "$REQUESTED_FRONTEND_COMMIT"
            git -C "$frontend_dir" checkout --detach "$REQUESTED_FRONTEND_COMMIT"
          fi
          frontend_commit="$(git -C "$frontend_dir" rev-parse HEAD)"
          [[ "$frontend_commit" =~ ^[a-f0-9]{40}$ ]]
          npm install --prefix libs/contract --no-audit --no-fund --no-package-lock --ignore-scripts
          npm run --prefix libs/contract prepublish
          contract_tarball="$(npm pack ./libs/contract --pack-destination "$RUNNER_TEMP" --silent)"
          npm ci --prefix "$frontend_dir" --prefer-offline --no-audit --no-fund
          npm install --prefix "$frontend_dir" --no-audit --no-fund --no-package-lock --no-save "$RUNNER_TEMP/$contract_tarball"
          npm test --prefix "$frontend_dir"
          npm run --prefix "$frontend_dir" start:build
          mkdir .xboard-frontend
          cp -a "$frontend_dir/dist/." .xboard-frontend/

          echo "version=$(jq -r .version package.json)-xboard" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$frontend_commit" >> "$GITHUB_OUTPUT"
          {
            echo "image_tags<<TAGS"
            echo "$IMAGE_NAME:backend-$GITHUB_SHA-frontend-$frontend_commit"
            if [[ "$GITHUB_REF" == refs/heads/xboard-dev ]]; then
              echo "$IMAGE_NAME:xboard-dev"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Paired backend $GITHUB_SHA with frontend $frontend_commit and contract $(git rev-parse HEAD:libs/contract)." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # Publish immutable source-pair tags for VPS/browser acceptance. Only xboard-dev
          # receives the mutable deployment tag, generated explicitly by the metadata step.
          push: true
          tags: ${{ steps.metadata.outputs.image_tags }}
          build-args: |
            BRANCH=dev
            SOURCE_REPOSITORY=https://github.com/FengYuchen1314/backend
            FRONTEND_SOURCE=local
            FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend_commit }}
            __RW_METADATA_VERSION=${{ steps.metadata.outputs.version }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
