name: Xboard CI

on:
  push:
    branches:
      - main
      - xboard-dev
      - 'wip/**'
      - xboard-topology-backend
  pull_request:
permissions:
  contents: read

concurrency:
  group: xboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build backend
    if: github.repository == 'FengYuchen1314/backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edge_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: edge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edge_test -d edge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine change range
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check changed-file formatting
        shell: bash
        run: |
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ steps.changes.outputs.base }}" \
              "${{ steps.changes.outputs.head }}" -- \
              '*.css' '*.js' '*.json' '*.md' '*.prisma' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test && npm run test:anytls && npm run test:topology && npm run test:seed

      - name: Test generated topology subscriptions with real clients
        env:
          RW_TOPOLOGY_TEST_REPETITIONS: 10
        run: bash scripts/test-topology-clients.sh

      - name: Generate Prisma client
        run: npm run migrate:generate

      - name: Test edge settings migrations and concurrent writes
        env:
          DATABASE_URL: postgresql://edge_test:disposable-ci-password@127.0.0.1:5432/edge_test
          DIRECT_URL: postgresql://edge_test:disposable-ci-password@127.0.0.1:5432/edge_test
          EDGE_DATABASE_TEST_URL: postgresql://edge_test:disposable-ci-password@127.0.0.1:5432/edge_test
        run: npm run migrate:deploy && npm run test:edge-settings && npm run test:topology-db && npm run test:seed-db && npm run test:anytls-db

      - name: Build
        run: npm run build

      - name: Verify application dependency wiring and OpenAPI generation
        run: npm run generate:openapi && test -s openapi.json

      - name: Compile and verify the portable VPS acceptance bundle
        env:
          RW_TOPOLOGY_TEST_BUNDLE: test-dist/topology-clients.test.cjs
          RW_TOPOLOGY_EXPORT_DIR: test-dist/clients
        run: |
          npm run build:topology-test
          bash scripts/test-topology-clients.sh
          node --test test-dist/anytls-panel.test.cjs
          printf '%s\n' "$GITHUB_SHA" > test-dist/SOURCE_COMMIT
          cp scripts/vps-topology-smoke.sh test-dist/
          cp scripts/vps-anytls-panel-smoke.sh test-dist/
          tar --create --gzip --file topology-acceptance.tar.gz --directory test-dist .
          sha256sum topology-acceptance.tar.gz > topology-acceptance.tar.gz.sha256

      - name: Upload the checksum-verified acceptance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topology-acceptance-${{ github.sha }}
          path: |
            topology-acceptance.tar.gz
            topology-acceptance.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
